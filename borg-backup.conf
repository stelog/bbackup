# ============================================
# Borg Backup Configuration
# /usr/local/etc/borg/borg-backup.conf
# ============================================

# Backup destination
BACKUP_MOUNT="/mnt/backup_borg"
BORG_REPO="$BACKUP_MOUNT/borg-repo"

# File locations
EXCLUDE_FILE="/usr/local/etc/borg/borg-exclude.txt"
LOG_FILE="/var/log/borg-backup.log"
PACKAGE_LIST_DIR="/usr/local/etc/borg"

# Passphrase file location
BORG_PASSPHRASE_FILE="/usr/local/etc/borg/borg-passphrase"

# Backup paths
BACKUP_PATHS=(
    /home
    /root
    /etc
    /var/spool/cron
    /var/log
    /opt
    /usr/local/bin
    /usr/local/etc
    /usr/local/lib/systemd/system
)

# Retention policy
KEEP_DAILY=7
KEEP_WEEKLY=4
KEEP_MONTHLY=6

# Compression algorithm (lz4, zstd, zlib, lzma, none)
COMPRESSION="lz4"

# Run repository check on this day of week (1=Monday, 7=Sunday)
CHECK_DAY=7
